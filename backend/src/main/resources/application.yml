spring:
  application:
    name: code-tutor-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/codetutor
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:code-tutor-very-secret-key-minimum-256-bits-long-for-hs256-algorithm}
  access-token-expiration: 86400000     # 24 hours in milliseconds
  refresh-token-expiration: 604800000   # 7 days in milliseconds

# CORS Configuration
cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

# File Upload Limits
spring.servlet.multipart:
  max-file-size: 100MB
  max-request-size: 100MB

# Logging
logging:
  level:
    com.codetutor: DEBUG
    org.springframework.security: INFO
